name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Windows 构建
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Build
        shell: cmd
        run: build.bat

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/web-serial-terminal.exe
          retention-days: 1

  # Linux 构建
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Install GTK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libappindicator3-dev

      - name: Setup Python for icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Pillow for icon generation
        run: pip install Pillow

      - name: Build
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/web-serial-terminal
          retention-days: 1

  # 创建 Release
  create-release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: dist/

      - name: Make Linux executable
        run: chmod +x dist/web-serial-terminal

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.VERSION }}
          body: |
            ## 更新内容

            请查看 [CHANGELOG.md](CHANGELOG.md) 获取详细更新日志。

            ## 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `web-serial-terminal.exe` | Windows 桌面版 |
            | Linux | `web-serial-terminal` | Linux 桌面版 |

            ## 使用方法

            **Windows:**
            1. 下载 `web-serial-terminal.exe`
            2. 双击运行
            3. 浏览器会自动打开 http://localhost:8080

            **Linux:**
            1. 下载 `web-serial-terminal`
            2. 运行: `./web-serial-terminal`
            3. 浏览器会自动打开 http://localhost:8080

            > **Linux 用户**: 系统托盘功能需要安装 GTK3 和 AppIndicator：
            > ```bash
            > sudo apt-get install libgtk-3-dev libappindicator3-dev
            > ```
          files: |
            dist/web-serial-terminal.exe
            dist/web-serial-terminal
          draft: false
          prerelease: false
